# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [master, devel]
  pull_request:
    branches: [master, devel]

name: BioC-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Check against Bioconductor devel, as the Bioconductor builders do.
      # Update at each Bioconductor release (see ADR 0007).
      R_BIOC_VERSION: "3.24"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install fftw3 on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install libfftw3-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            bioc::BiocCheck
          cache: true

      - name: Build package tarball
        # BiocCheck runs on the built tarball, as on the Bioconductor builders.
        # Run on the Git checkout, BiocCheck >= 1.49 errors on the tracked
        # .claude/settings.json that the lab standards commit; the tarball
        # excludes it through .Rbuildignore (see ADR 0007).
        run: R CMD build .
        shell: bash

      - name: Run BiocCheck
        run: |
          library(BiocCheck)
          tarball <- Sys.glob("singleCellTK_*.tar.gz")
          BiocCheck::BiocCheck(tarball,
              `quit-with-status` = TRUE,
              `no-check-R-ver` = TRUE,
              `no-check-bioc-help` = TRUE
          )
        shell: Rscript {0}
